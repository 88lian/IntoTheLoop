<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Home for the Peculiar | Live Q&A</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IM+Fell+English&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --paper-color: #e8e2d2;
            --ink-color: #2c2c2c;
            --accent-red: #8b0000;
            --bg-dark: #121212;
            --admin-bg: #0f1115;
        }

        /* RESET & BASE */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Special Elite', typewriter, serif;
            min-height: 100vh;
            background-color: var(--bg-dark);
            color: var(--ink-color);
            transition: background-color 0.3s ease;
        }

        /* THE CHAMELEON: OBS / PROJECTOR OVERLAY MODE */
        body.obs-overlay {
            background-color: transparent !important;
            overflow: hidden;
            padding: 50px; 
        }

        /* ADMIN MODE STYLING */
        body.admin-mode {
            background-color: var(--admin-bg);
            color: #e0e0e0;
            background-image: radial-gradient(circle at center, #1a1c22 0%, #0f1115 100%);
        }

        /* AUDIENCE SUBMISSION UI */
        .submission-container {
            max-width: 500px;
            margin: 80px auto;
            background: var(--paper-color);
            padding: 40px 30px;
            background-image: url('https://www.transparenttextures.com/patterns/parchment.png');
            box-shadow: 15px 15px 40px rgba(0,0,0,0.8);
            clip-path: polygon(1% 2%, 98% 0%, 100% 97%, 3% 100%, 0% 95%);
            transform: rotate(-1deg);
            transition: transform 0.3s ease;
        }

        h1 { font-family: 'IM Fell English', serif; color: var(--accent-red); text-align: center; font-size: 2.2rem; margin: 0 0 10px 0; }
        .sub-header { text-align: center; font-style: italic; opacity: 0.8; margin-bottom: 30px; display: block; }
        
        textarea#question-input {
            width: 100%;
            height: 150px;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(0,0,0,0.2);
            font-family: 'Special Elite', serif;
            font-size: 1.2rem;
            line-height: 1.5;
            outline: none;
            padding: 10px;
            display: block;
            resize: none;
        }

        button.action-btn {
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 20px;
            font-family: 'Special Elite', serif;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 30px;
            box-shadow: 0 5px 0 #5a0000;
            transition: all 0.1s;
        }
        button.action-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #5a0000; }
        button.action-btn:disabled { background: #666; cursor: not-allowed; box-shadow: none; }

        /* LIVE OVERLAY - PROJECTOR */
        #qa-container {
            display: flex;
            flex-direction: column; /* Vertical stack ensures smoother sliding logic */
            gap: 30px;
            max-width: 1000px;
            margin: 0 auto;
            perspective: 1000px;
        }

        .question-card {
            width: 100%;
            background-color: var(--paper-color);
            padding: 35px 45px; 
            position: relative;
            background-image: url('https://www.transparenttextures.com/patterns/parchment.png');
            box-shadow: 8px 8px 25px rgba(0,0,0,0.4);
            border-left: 12px solid var(--accent-red); 
            clip-path: polygon(0% 0%, 100% 1%, 99.5% 99%, 0.5% 100%);
            transition: opacity 1s cubic-bezier(0.23, 1, 0.32, 1), transform 1s cubic-bezier(0.23, 1, 0.32, 1);
            pointer-events: none;
            will-change: transform, opacity;
            transform-origin: center top;
        }

        /* Entry State */
        .card-entering {
            opacity: 0;
            transform: translateY(40px) rotateX(-15deg) scale(0.95);
        }

        /* Active State */
        .card-active {
            opacity: 1;
            transform: translateY(0) rotateX(0deg) scale(1);
        }

        /* Exit State */
        .question-card.exiting {
            opacity: 0 !important;
            transform: translateY(-40px) rotateX(15deg) scale(0.9) !important;
            margin-bottom: -150px; /* Collapse space smoothly */
            pointer-events: none;
            z-index: -1;
        }

        .card-label { 
            font-size: 0.9rem; 
            color: var(--accent-red); 
            text-transform: uppercase; 
            letter-spacing: 5px;
            margin-bottom: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            opacity: 0.7;
        }
        .card-label::after { content: ""; flex: 1; height: 1px; background: rgba(139, 0, 0, 0.3); margin-left: 15px; }

        .question-text { 
            font-size: 1.8rem; 
            color: var(--ink-color); 
            margin: 0; 
            line-height: 1.4;
            font-family: 'Special Elite', serif;
            word-wrap: break-word;
        }

        /* ADMIN INTERFACE */
        .admin-card {
            background: #1e2128;
            color: #fff;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: cardEnterAdmin 0.4s ease-out;
        }
        .admin-controls { display: flex; gap: 12px; }
        .toggle-btn {
            padding: 12px 20px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-family: 'Special Elite', serif;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .toggle-btn:hover { opacity: 0.8; }
        .btn-show { background: #2ecc71; color: white; }
        .btn-hide { background: #e67e22; color: white; }
        .btn-delete { background: #e74c3c; color: white; }

        @keyframes cardEnterAdmin {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hidden { display: none !important; }
        #status-msg { text-align: center; margin-top: 15px; font-size: 0.9rem; min-height: 1.2em; color: var(--accent-red); }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 40px 0;
            padding-bottom: 20px;
            border-bottom: 2px solid #333;
        }
    </style>
</head>
<body>

    <!-- VIEW 1: SUBMISSION -->
    <div id="view-submission" class="submission-container hidden">
        <h1>A Home for the Peculiar</h1>
        <span class="sub-header">Submit your inquiry to the panel</span>
        <textarea id="question-input" placeholder="Type your inquiry here..."></textarea>
        <button id="submit-btn" class="action-btn">SEND INTO THE LOOP</button>
        <div id="status-msg"></div>
    </div>

    <!-- VIEW 2: ADMIN PANEL -->
    <div id="view-admin" class="hidden" style="max-width: 900px; margin: 0 auto; padding: 20px;">
        <div class="admin-header">
            <div>
                <h1 style="text-align: left; color: #fff; margin:0;">Moderation Chamber</h1>
                <p style="margin:5px 0 0 0; opacity: 0.6;">Control the visible inquiries</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="window.bulkVisibility(true)" class="toggle-btn btn-show">SHOW ALL</button>
                <button onclick="window.bulkVisibility(false)" class="toggle-btn btn-hide">HIDE ALL</button>
            </div>
        </div>
        <div id="admin-list"></div>
    </div>

    <!-- VIEW 3: PROJECTOR/DISPLAY -->
    <div id="view-display" class="hidden">
        <div id="qa-container"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyBTjoy3Kvc3L5Fl6XIy3lq-L8BFMOY77gM",
            authDomain: "missperi.firebaseapp.com",
            projectId: "missperi",
            storageBucket: "missperi.firebasestorage.app",
            messagingSenderId: "825548876752",
            appId: "1:825548876752:web:e2f64e3d688e147040a7d5",
            measurementId: "G-F3KVKSW3P3"
        };

        const APP_COLLECTION_ID = 'peculiar_app';
        const params = new URLSearchParams(window.location.search);
        
        const IS_ADMIN = params.get('admin') === 'true';
        const IS_DISPLAY = params.get('display') === 'true';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        signInAnonymously(auth).then((userCred) => {
            if (IS_ADMIN) {
                initAdmin(db);
            } else if (IS_DISPLAY) {
                initDisplay(db);
            } else {
                initSubmission(db, userCred.user.uid);
            }
        });

        function initSubmission(db, uid) {
            const view = document.getElementById('view-submission');
            view.classList.remove('hidden');
            const btn = document.getElementById('submit-btn');
            const input = document.getElementById('question-input');
            const status = document.getElementById('status-msg');

            btn.onclick = async () => {
                const text = input.value.trim();
                if (!text) return;
                btn.disabled = true;
                status.innerText = "Transmitting...";
                try {
                    await addDoc(collection(db, 'artifacts', APP_COLLECTION_ID, 'public', 'data', 'questions'), {
                        text: text,
                        timestamp: serverTimestamp(),
                        author: uid,
                        visible: false
                    });
                    input.value = "";
                    status.innerText = "Sent successfully.";
                    setTimeout(() => status.innerText = "", 3000);
                } catch (e) { status.innerText = "Error."; } 
                finally { btn.disabled = false; }
            };
        }

        let adminDocs = [];
        function initAdmin(db) {
            document.body.classList.add('admin-mode');
            const view = document.getElementById('view-admin');
            const list = document.getElementById('admin-list');
            view.classList.remove('hidden');

            const q = collection(db, 'artifacts', APP_COLLECTION_ID, 'public', 'data', 'questions');
            onSnapshot(q, (snapshot) => {
                adminDocs = snapshot.docs;
                const items = snapshot.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .sort((a, b) => (b.timestamp?.toMillis() || 0) - (a.timestamp?.toMillis() || 0));

                list.innerHTML = "";
                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'admin-card';
                    card.innerHTML = `
                        <div style="flex:1; padding-right:20px;">
                            <p style="margin:0; font-size:1.2rem; color:#fff;">${escape(item.text)}</p>
                            <small style="opacity:0.4; font-family:monospace;">${item.id}</small>
                        </div>
                        <div class="admin-controls">
                            <button class="toggle-btn ${item.visible ? 'btn-hide' : 'btn-show'}" 
                                onclick="window.toggleVis('${item.id}', ${!item.visible})">
                                ${item.visible ? 'HIDE' : 'SHOW'}
                            </button>
                            <button class="toggle-btn btn-delete" onclick="window.delItem('${item.id}')">DEL</button>
                        </div>
                    `;
                    list.appendChild(card);
                });
            });

            window.toggleVis = async (id, state) => {
                const ref = doc(db, 'artifacts', APP_COLLECTION_ID, 'public', 'data', 'questions', id);
                await updateDoc(ref, { visible: state });
            };
            window.delItem = async (id) => {
                if(!confirm("Erase permanently?")) return;
                const ref = doc(db, 'artifacts', APP_COLLECTION_ID, 'public', 'data', 'questions', id);
                await deleteDoc(ref);
            };
            window.bulkVisibility = async (state) => {
                for (const d of adminDocs) {
                    const ref = doc(db, 'artifacts', APP_COLLECTION_ID, 'public', 'data', 'questions', d.id);
                    await updateDoc(ref, { visible: state });
                }
            };
        }

        function initDisplay(db) {
            document.body.classList.add('obs-overlay');
            const view = document.getElementById('view-display');
            const container = document.getElementById('qa-container');
            view.classList.remove('hidden');

            const q = collection(db, 'artifacts', APP_COLLECTION_ID, 'public', 'data', 'questions');
            let activeQuestionIds = new Set();

            onSnapshot(q, (snapshot) => {
                const currentData = snapshot.docs
                    .map(doc => ({ id: doc.id, ...doc.data() }))
                    .filter(d => d.timestamp && d.visible === true)
                    .sort((a, b) => b.timestamp.toMillis() - a.timestamp.toMillis())
                    .slice(0, 10);

                const currentIds = new Set(currentData.map(d => d.id));

                // 1. Snapshot First Positions for FLIP
                const firstPositions = {};
                activeQuestionIds.forEach(id => {
                    const el = document.getElementById(`q-${id}`);
                    if (el && !el.classList.contains('exiting')) {
                        firstPositions[id] = el.getBoundingClientRect();
                    }
                });

                // 2. Identify and flag exiting elements
                activeQuestionIds.forEach(id => {
                    if (!currentIds.has(id)) {
                        const el = document.getElementById(`q-${id}`);
                        if (el && !el.classList.contains('exiting')) {
                            el.classList.add('exiting');
                            // We don't remove from activeQuestionIds yet to prevent re-rendering logic issues
                            setTimeout(() => {
                                if (el && el.parentNode) el.remove();
                                activeQuestionIds.delete(id);
                            }, 1000); // Wait for transition
                        }
                    }
                });

                // 3. Create and append new elements
                currentData.forEach(data => {
                    if (!activeQuestionIds.has(data.id)) {
                        activeQuestionIds.add(data.id);
                        const card = document.createElement('div');
                        card.id = `q-${data.id}`;
                        card.className = 'question-card card-entering';
                        card.innerHTML = `<div class="card-label">Incoming Inquiry</div><p class="question-text">${escape(data.text)}</p>`;
                        
                        // We always prepend since we sort newest first
                        container.prepend(card);
                        
                        // Smallest possible delay to trigger CSS transition
                        requestAnimationFrame(() => {
                            card.classList.remove('card-entering');
                            card.classList.add('card-active');
                        });
                    }
                });

                // 4. FLIP: Play animation for elements that moved
                requestAnimationFrame(() => {
                    currentIds.forEach(id => {
                        const el = document.getElementById(`q-${id}`);
                        if (el && firstPositions[id]) {
                            const lastPos = el.getBoundingClientRect();
                            const deltaY = firstPositions[id].top - lastPos.top;

                            if (Math.abs(deltaY) > 0.5) { // Threshold to prevent micro-snapping
                                // Invert
                                el.style.transition = 'none';
                                el.style.transform = `translateY(${deltaY}px)`;
                                
                                // Reflow
                                el.offsetHeight;

                                // Play
                                el.style.transition = 'transform 1s cubic-bezier(0.23, 1, 0.32, 1), opacity 1s ease';
                                el.style.transform = 'translateY(0)';
                            }
                        }
                    });
                });
            });
        }

        function escape(html) {
            const p = document.createElement('p');
            p.textContent = html;
            return p.innerHTML;
        }
    </script>
</body>
</html>
