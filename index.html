<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Home for the Peculiar | Live Q&A</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IM+Fell+English&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --paper-color: #e8e2d2;
            --ink-color: #2c2c2c;
            --accent-red: #8b0000;
            --bg-dark: #121212;
            --admin-bg: #0f1115;
            --transition-speed: 1.2s;
            --ease: cubic-bezier(0.23, 1, 0.32, 1); /* Smoother exponential ease */
        }

        /* RESET & BASE */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Special Elite', typewriter, serif;
            min-height: 100vh;
            background-color: var(--bg-dark);
            color: var(--ink-color);
            overflow-x: hidden;
        }

        /* THE CHAMELEON: OBS / PROJECTOR OVERLAY MODE */
        body.obs-overlay {
            background-color: transparent !important;
            overflow: hidden;
            padding: 0; 
        }

        /* ATMOSPHERIC AUDIENCE BACKGROUND */
        body:not(.admin-mode):not(.obs-overlay) {
            background: 
                radial-gradient(circle at 50% 50%, rgba(139, 0, 0, 0.1) 0%, rgba(18, 18, 18, 1) 100%),
                url('https://www.transparenttextures.com/patterns/dark-matter.png'),
                url('https://images.unsplash.com/photo-1501139083538-0139583c060f?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        body.admin-mode {
            background-color: var(--admin-bg);
            color: #e0e0e0;
            background-image: radial-gradient(circle at center, #1a1c22 0%, #0f1115 100%);
        }

        /* SUBMISSION UI */
        .submission-container {
            max-width: 600px;
            margin: 40px auto;
            background: var(--paper-color);
            padding: 50px 40px;
            background-image: url('https://www.transparenttextures.com/patterns/parchment.png');
            box-shadow: 0 0 80px rgba(0,0,0,0.8);
            clip-path: polygon(1% 1%, 99% 0.5%, 100% 98.5%, 1.5% 100%, 0% 95%);
            transform: rotate(-0.5deg);
            position: relative;
        }

        h1 { font-family: 'IM Fell English', serif; color: var(--accent-red); text-align: center; font-size: 2.8rem; margin: 0 0 5px 0; }
        .sub-header { text-align: center; font-style: italic; opacity: 0.8; margin-bottom: 35px; display: block; font-size: 0.9rem; }
        
        .input-group { margin-bottom: 25px; position: relative; }
        .input-label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: var(--accent-red); margin-bottom: 8px; font-weight: bold; }
        
        .modern-field {
            width: 100%;
            background: rgba(0,0,0,0.03);
            border: none;
            border-bottom: 2px solid rgba(0,0,0,0.1);
            font-family: 'Special Elite', serif;
            font-size: 1.1rem;
            padding: 12px 10px;
            outline: none;
            color: var(--ink-color);
        }
        .modern-field:focus { border-bottom-color: var(--accent-red); }
        textarea.modern-field { height: 180px; resize: none; }

        .identity-header {
            border-top: 1px dashed rgba(139, 0, 0, 0.2);
            padding-top: 25px;
            margin-top: 10px;
        }

        .anonymous-control {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            cursor: pointer;
            padding: 12px;
            background: rgba(0,0,0,0.03);
            border: 1px solid transparent;
        }
        .anonymous-control.active { border-color: var(--accent-red); background: rgba(139, 0, 0, 0.05); }

        button.action-btn {
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 22px;
            font-family: 'Special Elite', serif;
            font-size: 1.2rem;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 6px 0 #4a0000;
            transition: all 0.2s;
        }
        button.action-btn:hover { background: #a00000; }
        button.action-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #4a0000; }

        /* LIVE OVERLAY - PILE MECHANICS */
        #qa-container {
            position: relative;
            max-width: 1000px;
            margin: 0 auto;
            height: 100vh;
            perspective: 2000px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .question-card {
            position: absolute;
            width: 750px;
            min-height: 250px;
            background-color: var(--paper-color);
            padding: 40px 50px; 
            background-image: url('https://www.transparenttextures.com/patterns/parchment.png');
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border-left: 15px solid var(--accent-red); 
            clip-path: polygon(0.5% 0.5%, 99.5% 0%, 100% 99.5%, 0.5% 100%);
            
            transition: 
                transform var(--transition-speed) var(--ease),
                opacity var(--transition-speed) ease,
                filter var(--transition-speed) ease,
                box-shadow var(--transition-speed) ease;
            
            pointer-events: none;
            will-change: transform, opacity;
            
            opacity: 0;
            transform: translateY(100vh) rotateX(-45deg) scale(0.6);
            filter: blur(20px);
            z-index: 10;
        }

        /* PRIMARY CARD (FRONT) */
        .question-card[data-index="0"] {
            opacity: 1;
            transform: translateY(-80px) rotateX(0deg) scale(1) translateZ(0);
            filter: blur(0);
            z-index: 100;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
        }

        /* STACKED CARDS (BACKGROUND) */
        /* We push them DOWN (translateY) and BACK (translateZ) so they don't overlap textually */
        .question-card[data-index="1"] {
            opacity: 0.8;
            transform: translateY(180px) translateZ(-250px) rotateX(-15deg) scale(0.85);
            z-index: 80;
            filter: blur(2px);
        }

        .question-card[data-index="2"] {
            opacity: 0.5;
            transform: translateY(320px) translateZ(-500px) rotateX(-25deg) scale(0.7);
            z-index: 60;
            filter: blur(5px);
        }

        .question-card[data-index="3"] {
            opacity: 0.2;
            transform: translateY(440px) translateZ(-750px) rotateX(-35deg) scale(0.6);
            z-index: 40;
            filter: blur(10px);
        }

        .question-card.exiting {
            opacity: 0 !important;
            transform: translateY(-600px) rotateX(45deg) scale(0.5) translateZ(500px) !important;
            filter: blur(40px) !important;
        }

        .card-label { 
            font-size: 0.8rem; 
            color: var(--accent-red); 
            text-transform: uppercase; 
            letter-spacing: 4px;
            margin-bottom: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
        }
        .card-label::after { content: ""; flex: 1; height: 1px; background: rgba(139, 0, 0, 0.2); margin-left: 15px; }

        .author-meta {
            font-style: italic;
            font-size: 0.95rem;
            margin-bottom: 20px;
            display: block;
            color: rgba(0,0,0,0.6);
        }

        .question-text { 
            font-size: 2.2rem;
            color: var(--ink-color); 
            margin: 0; 
            line-height: 1.2;
            word-wrap: break-word;
        }

        /* ADMIN INTERFACE */
        .admin-card {
            background: #1e2128;
            color: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
        }
        .admin-controls { display: flex; gap: 10px; }
        .toggle-btn {
            padding: 10px 15px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-family: 'Special Elite', serif;
        }
        .btn-show { background: #2ecc71; color: white; }
        .btn-hide { background: #e67e22; color: white; }
        .btn-delete { background: #e74c3c; color: white; }

        .hidden { display: none !important; }
        #status-msg { text-align: center; margin-top: 15px; font-size: 0.9rem; color: var(--accent-red); font-weight: bold; }
    </style>
</head>
<body>

    <!-- VIEW 1: SUBMISSION -->
    <div id="view-submission" class="submission-container hidden">
        <h1>The Peculiar Portal</h1>
        <span class="sub-header">Submit your inquiry to the loop</span>
        
        <div class="input-group">
            <label class="input-label" for="question-input">Your Inquiry</label>
            <textarea id="question-input" class="modern-field" placeholder="What secrets shall we unravel today?"></textarea>
        </div>

        <div class="identity-header">
            <div id="identity-fields">
                <div class="input-group">
                    <label class="input-label" for="user-nickname">Nickname</label>
                    <input type="text" id="user-nickname" class="modern-field" placeholder="How shall we address you?">
                </div>

                <div class="input-group">
                    <label class="input-label" for="user-course">Course & Year Level</label>
                    <input type="text" id="user-course" class="modern-field" placeholder="e.g. BS Arch - 3rd Year">
                </div>
            </div>

            <label class="anonymous-control" id="anon-label">
                <input type="checkbox" id="anon-toggle">
                <span>Remain Anonymous</span>
            </label>
        </div>

        <button id="submit-btn" class="action-btn">TRANSMIT INTO THE LOOP</button>
        <div id="status-msg"></div>
    </div>

    <!-- VIEW 2: ADMIN PANEL -->
    <div id="view-admin" class="hidden" style="max-width: 900px; margin: 0 auto; padding: 20px;">
        <h1 style="color: #fff; text-align: left;">Moderation Chamber</h1>
        <div id="admin-list"></div>
    </div>

    <!-- VIEW 3: PROJECTOR/DISPLAY -->
    <div id="view-display" class="hidden">
        <div id="qa-container"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBTjoy3Kvc3L5Fl6XIy3lq-L8BFMOY77gM",
            authDomain: "missperi.firebaseapp.com",
            projectId: "missperi",
            storageBucket: "missperi.firebasestorage.app",
            messagingSenderId: "825548876752",
            appId: "1:825548876752:web:e2f64e3d688e147040a7d5"
        };

        const APP_COLLECTION_ID = 'peculiar_app';
        const params = new URLSearchParams(window.location.search);
        const IS_ADMIN = params.get('admin') === 'true';
        const IS_DISPLAY = params.get('display') === 'true';

        const PECULIAR_NAMES = [
            "The Invisible Boy", "The Girl with the Bees", "The Floater", 
            "The Pyrotechnic", "The Shadow Manipulator", "The Bone Sculptor",
            "The Animal Whisperer", "The Plant Grower", "The Master of Puppets"
        ];

        const escapeHTML = (str) => {
            const p = document.createElement('p');
            p.textContent = str || "";
            return p.innerHTML;
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        signInAnonymously(auth).then((userCred) => {
            if (IS_ADMIN) initAdmin();
            else if (IS_DISPLAY) initDisplay();
            else initSubmission(userCred.user.uid);
        });

        function initSubmission(uid) {
            const view = document.getElementById('view-submission');
            const btn = document.getElementById('submit-btn');
            const input = document.getElementById('question-input');
            const nicknameInput = document.getElementById('user-nickname');
            const courseInput = document.getElementById('user-course');
            const anonToggle = document.getElementById('anon-toggle');
            const anonLabel = document.getElementById('anon-label');
            const identityFields = document.getElementById('identity-fields');
            const status = document.getElementById('status-msg');
            
            view.classList.remove('hidden');

            anonToggle.onchange = () => {
                const isChecked = anonToggle.checked;
                anonLabel.classList.toggle('active', isChecked);
                identityFields.classList.toggle('hidden', isChecked);
            };

            btn.onclick = async () => {
                const text = input.value.trim();
                if (!text) return;
                
                btn.disabled = true;
                status.innerText = "Transmitting...";
                
                let assignedName = nicknameInput.value.trim() || "A Guest";
                if (anonToggle.checked) {
                    assignedName = PECULIAR_NAMES[Math.floor(Math.random() * PECULIAR_NAMES.length)];
                }
                
                try {
                    await addDoc(collection(db, 'artifacts', APP_COLLECTION_ID, 'public', 'data', 'questions'), {
                        text,
                        timestamp: serverTimestamp(),
                        authorId: uid,
                        visible: false,
                        isAnonymous: anonToggle.checked,
                        nickname: assignedName,
                        course: anonToggle.checked ? "" : courseInput.value.trim()
                    });
                    input.value = "";
                    status.innerText = "Sent into the Loop.";
                    setTimeout(() => status.innerText = "", 3000);
                } catch (e) {
                    status.innerText = "Error transmitting.";
                } finally {
                    btn.disabled = false;
                }
            };
        }

        function initAdmin() {
            document.body.classList.add('admin-mode');
            const view = document.getElementById('view-admin');
            const list = document.getElementById('admin-list');
            view.classList.remove('hidden');
            
            onSnapshot(collection(db, 'artifacts', APP_COLLECTION_ID, 'public', 'data', 'questions'), (snapshot) => {
                const items = snapshot.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .sort((a, b) => (b.timestamp?.toMillis() || 0) - (a.timestamp?.toMillis() || 0));

                list.innerHTML = items.length ? "" : '<div style="opacity:0.5">Waiting for inquiries...</div>';
                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'admin-card';
                    card.innerHTML = `
                        <div style="flex:1">
                            <small style="color:var(--accent-red)">${item.isAnonymous ? '[ANON]' : ''} ${escapeHTML(item.nickname)}</small>
                            <p style="margin:5px 0 0 0">${escapeHTML(item.text)}</p>
                        </div>
                        <div class="admin-controls">
                            <button class="toggle-btn ${item.visible ? 'btn-hide' : 'btn-show'}">${item.visible ? 'HIDE' : 'SHOW'}</button>
                            <button class="toggle-btn btn-delete">DEL</button>
                        </div>
                    `;
                    card.querySelector('.btn-delete').onclick = () => deleteDoc(doc(db, 'artifacts', APP_COLLECTION_ID, 'public', 'data', 'questions', item.id));
                    card.querySelector('.btn-show, .btn-hide').onclick = () => updateDoc(doc(db, 'artifacts', APP_COLLECTION_ID, 'public', 'data', 'questions', item.id), { visible: !item.visible });
                    list.appendChild(card);
                });
            });
        }

        function initDisplay() {
            document.body.classList.add('obs-overlay');
            const container = document.getElementById('qa-container');
            document.getElementById('view-display').classList.remove('hidden');

            onSnapshot(collection(db, 'artifacts', APP_COLLECTION_ID, 'public', 'data', 'questions'), (snapshot) => {
                const activeData = snapshot.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .filter(d => d.timestamp && d.visible === true)
                    .sort((a, b) => b.timestamp.toMillis() - a.timestamp.toMillis())
                    .slice(0, 4); 

                const activeIds = new Set(activeData.map(d => d.id));
                Array.from(container.querySelectorAll('.question-card')).forEach(el => {
                    if (!activeIds.has(el.dataset.id) && !el.classList.contains('exiting')) {
                        el.classList.add('exiting');
                        el.removeAttribute('data-index');
                        setTimeout(() => el.remove(), 1300);
                    }
                });

                activeData.forEach((data, index) => {
                    let el = document.getElementById(`q-${data.id}`);
                    if (!el) {
                        el = document.createElement('div');
                        el.id = `q-${data.id}`;
                        el.dataset.id = data.id;
                        el.className = 'question-card';
                        el.innerHTML = `
                            <div class="card-label"></div>
                            <span class="author-meta"></span>
                            <p class="question-text"></p>
                        `;
                        container.appendChild(el);
                    }

                    el.setAttribute('data-index', index);
                    el.querySelector('.card-label').innerText = index === 0 ? "The Primary Inquiry" : `Peculiar History [${index}]`;
                    el.querySelector('.author-meta').innerText = data.isAnonymous ? `From: ${data.nickname}` : `From: ${data.nickname} (${data.course})`;
                    el.querySelector('.question-text').innerText = data.text;
                });
            });
        }
    </script>
</body>
</html>
