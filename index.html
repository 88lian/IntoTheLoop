<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Home for the Peculiar | Live Q&A</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IM+Fell+English&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --paper-color: #e8e2d2;
            --ink-color: #2c2c2c;
            --accent-red: #8b0000;
            --bg-dark: #121212;
            --admin-bg: #0f1115;
            --transition-speed: 1.4s;
            --ease: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* RESET & BASE */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Special Elite', typewriter, serif;
            min-height: 100vh;
            background-color: var(--bg-dark);
            color: var(--ink-color);
            overflow-x: hidden;
        }

        /* THE CHAMELEON: OBS / PROJECTOR OVERLAY MODE */
        body.obs-overlay {
            background-color: transparent !important;
            overflow: hidden;
            padding: 50px; 
        }

        /* ATMOSPHERIC AUDIENCE BACKGROUND */
        body:not(.admin-mode):not(.obs-overlay) {
            background: 
                radial-gradient(circle at 50% 50%, rgba(139, 0, 0, 0.1) 0%, rgba(18, 18, 18, 1) 100%),
                url('https://www.transparenttextures.com/patterns/dark-matter.png'),
                url('https://images.unsplash.com/photo-1501139083538-0139583c060f?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* ADMIN MODE STYLING */
        body.admin-mode {
            background-color: var(--admin-bg);
            color: #e0e0e0;
            background-image: radial-gradient(circle at center, #1a1c22 0%, #0f1115 100%);
        }

        /* MODERNIZED SUBMISSION UI */
        .submission-container {
            max-width: 600px;
            margin: 40px auto;
            background: var(--paper-color);
            padding: 50px 40px;
            background-image: url('https://www.transparenttextures.com/patterns/parchment.png');
            box-shadow: 0 0 80px rgba(0,0,0,0.8), 20px 20px 60px rgba(0,0,0,0.9);
            clip-path: polygon(1% 1%, 99% 0.5%, 100% 98.5%, 1.5% 100%, 0% 95%);
            transform: rotate(-0.5deg);
            position: relative;
            border: 1px solid rgba(0,0,0,0.1);
        }

        h1 { font-family: 'IM Fell English', serif; color: var(--accent-red); text-align: center; font-size: 2.8rem; margin: 0 0 5px 0; letter-spacing: -1px; }
        .sub-header { text-align: center; font-style: italic; opacity: 0.8; margin-bottom: 35px; display: block; letter-spacing: 1px; font-size: 0.9rem; }
        
        /* Modern Input Styling */
        .input-group { margin-bottom: 25px; position: relative; }
        .input-label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: var(--accent-red); margin-bottom: 8px; font-weight: bold; }
        
        .modern-field {
            width: 100%;
            background: rgba(0,0,0,0.03);
            border: none;
            border-bottom: 2px solid rgba(0,0,0,0.1);
            font-family: 'Special Elite', serif;
            font-size: 1.1rem;
            padding: 12px 10px;
            outline: none;
            color: var(--ink-color);
            transition: border-color 0.3s ease;
        }
        .modern-field:focus { border-bottom-color: var(--accent-red); background: rgba(0,0,0,0.05); }

        textarea.modern-field { height: 180px; resize: none; line-height: 1.6; }

        /* Identity Section Styling */
        .identity-header {
            border-top: 1px dashed rgba(139, 0, 0, 0.2);
            padding-top: 25px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        /* Anonymous Toggle */
        .anonymous-control {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            cursor: pointer;
            user-select: none;
            padding: 12px;
            border-radius: 8px;
            background: rgba(0,0,0,0.03);
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        .anonymous-control:hover { background: rgba(0,0,0,0.06); }
        .anonymous-control.active { border-color: var(--accent-red); background: rgba(139, 0, 0, 0.05); }
        .anonymous-control input { width: 20px; height: 20px; cursor: pointer; accent-color: var(--accent-red); }

        #identity-fields {
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform-origin: top;
        }

        button.action-btn {
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 22px;
            font-family: 'Special Elite', serif;
            font-size: 1.2rem;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 6px 0 #4a0000;
            transition: all 0.2s;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        button.action-btn:hover { background: #a00000; transform: translateY(-2px); }
        button.action-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #4a0000; }
        button.action-btn:disabled { background: #666 !important; cursor: not-allowed; box-shadow: none; transform: none; }

        /* LIVE OVERLAY - PILE MECHANICS */
        #qa-container {
            position: relative;
            max-width: 900px;
            margin: 50px auto;
            height: 90vh;
            perspective: 2500px;
            display: flex;
            justify-content: center;
        }

        .question-card {
            position: absolute;
            width: 85%;
            background-color: var(--paper-color);
            padding: 35px 45px; 
            background-image: url('https://www.transparenttextures.com/patterns/parchment.png');
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border-left: 12px solid var(--accent-red); 
            clip-path: polygon(0.5% 0.5%, 99.5% 0%, 100% 99.5%, 0.5% 100%);
            
            transition: 
                transform var(--transition-speed) var(--ease),
                opacity var(--transition-speed) ease,
                filter var(--transition-speed) ease,
                box-shadow var(--transition-speed) ease,
                background-color var(--transition-speed) ease;
            
            pointer-events: none;
            will-change: transform, opacity;
            transform-origin: center center;
            
            opacity: 0;
            transform: translateY(100vh) rotateX(-45deg) scale(0.6) translateZ(-500px);
            filter: blur(20px);
            z-index: 10;
        }

        .question-card[data-index="0"] {
            opacity: 1;
            transform: translateY(0) rotateX(0deg) scale(1.1) translateZ(0);
            filter: blur(0);
            z-index: 100;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
            background-color: var(--paper-color);
        }

        .question-card[data-index]:not([data-index="0"]) {
            opacity: 1;
            transform: 
                translateY(calc(var(--stack-index) * 80px + 140px)) 
                translateZ(calc(var(--stack-index) * -150px)) 
                rotateX(calc(var(--stack-index) * -12deg))
                scale(calc(1 - (var(--stack-index) * 0.12)));
            
            filter: blur(calc(var(--stack-index) * 2px));
            z-index: calc(90 - var(--stack-index));
            background-color: #dcd6c5;
            opacity: calc(1 - (var(--stack-index) * 0.2));
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .question-card.exiting {
            opacity: 0 !important;
            transform: translateY(-500px) rotateX(60deg) scale(0.6) translateZ(400px) !important;
            filter: blur(40px) !important;
        }

        .card-label { 
            font-size: 0.75rem; 
            color: var(--accent-red); 
            text-transform: uppercase; 
            letter-spacing: 4px;
            margin-bottom: 8px;
            font-weight: bold;
            display: flex;
            align-items: center;
            opacity: 0.8;
        }
        .card-label::after { content: ""; flex: 1; height: 1px; background: rgba(139, 0, 0, 0.15); margin-left: 15px; }

        .author-meta {
            font-style: italic;
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: block;
            color: rgba(0,0,0,0.6);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding-bottom: 5px;
        }

        .question-text { 
            font-size: 2rem;
            color: var(--ink-color); 
            margin: 0; 
            line-height: 1.3;
            font-family: 'Special Elite', serif;
            word-wrap: break-word;
        }

        .question-card:not([data-index="0"]) .question-text { font-size: 1.5rem; }

        /* ADMIN INTERFACE */
        .admin-card {
            background: #1e2128;
            color: #fff;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .admin-controls { display: flex; gap: 12px; }
        .toggle-btn {
            padding: 12px 20px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-family: 'Special Elite', serif;
            font-weight: bold;
            transition: transform 0.1s, opacity 0.2s;
        }
        .toggle-btn:hover { opacity: 0.9; transform: scale(1.05); }
        .toggle-btn:active { transform: scale(0.95); }
        .btn-show { background: #2ecc71; color: white; }
        .btn-hide { background: #e67e22; color: white; }
        .btn-delete { background: #e74c3c; color: white; }

        .hidden { display: none !important; }
        #status-msg { text-align: center; margin-top: 15px; font-size: 0.9rem; min-height: 1.2em; color: var(--accent-red); font-weight: bold; }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 40px 0;
            padding-bottom: 20px;
            border-bottom: 2px solid #333;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            opacity: 0.5;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- VIEW 1: SUBMISSION -->
    <div id="view-submission" class="submission-container hidden">
        <h1>The Peculiar Portal</h1>
        <span class="sub-header">Submit your inquiry to the loop</span>
        
        <!-- Primary Focus: The Inquiry -->
        <div class="input-group">
            <label class="input-label" for="question-input">Your Inquiry</label>
            <textarea id="question-input" class="modern-field" placeholder="What secrets shall we unravel today?"></textarea>
        </div>

        <!-- Identity Options -->
        <div class="identity-header">
            <label class="input-label">Identity Preferences</label>
            
            <label class="anonymous-control" id="anon-label">
                <input type="checkbox" id="anon-toggle">
                <span>Remain Anonymous</span>
            </label>

            <div id="identity-fields">
                <div class="input-group">
                    <label class="input-label" for="user-nickname">Nickname</label>
                    <input type="text" id="user-nickname" class="modern-field" placeholder="How shall we address you?">
                </div>

                <div class="input-group">
                    <label class="input-label" for="user-course">Course & Year Level</label>
                    <input type="text" id="user-course" class="modern-field" placeholder="e.g. BS Arch - 3rd Year">
                </div>
            </div>
        </div>

        <button id="submit-btn" class="action-btn">TRANSMIT INTO THE LOOP</button>
        <div id="status-msg"></div>
    </div>

    <!-- VIEW 2: ADMIN PANEL -->
    <div id="view-admin" class="hidden" style="max-width: 900px; margin: 0 auto; padding: 20px;">
        <div class="admin-header">
            <div>
                <h1 style="text-align: left; color: #fff; margin:0;">Moderation Chamber</h1>
                <p style="margin:5px 0 0 0; opacity: 0.6;">Manage the Peculiar Queue</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="bulk-show" class="toggle-btn btn-show">SHOW ALL</button>
                <button id="bulk-hide" class="toggle-btn btn-hide">HIDE ALL</button>
            </div>
        </div>
        <div id="admin-list"></div>
    </div>

    <!-- VIEW 3: PROJECTOR/DISPLAY -->
    <div id="view-display" class="hidden">
        <div id="qa-container"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBTjoy3Kvc3L5Fl6XIy3lq-L8BFMOY77gM",
            authDomain: "missperi.firebaseapp.com",
            projectId: "missperi",
            storageBucket: "missperi.firebasestorage.app",
            messagingSenderId: "825548876752",
            appId: "1:825548876752:web:e2f64e3d688e147040a7d5",
            measurementId: "G-F3KVKSW3P3"
        };

        const APP_COLLECTION_ID = 'peculiar_app';
        const params = new URLSearchParams(window.location.search);
        const IS_ADMIN = params.get('admin') === 'true';
        const IS_DISPLAY = params.get('display') === 'true';

        const escapeHTML = (str) => {
            const p = document.createElement('p');
            p.textContent = str || "";
            return p.innerHTML;
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        signInAnonymously(auth).then((userCred) => {
            if (IS_ADMIN) initAdmin();
            else if (IS_DISPLAY) initDisplay();
            else initSubmission(userCred.user.uid);
        });

        function initSubmission(uid) {
            const view = document.getElementById('view-submission');
            const btn = document.getElementById('submit-btn');
            const input = document.getElementById('question-input');
            const nicknameInput = document.getElementById('user-nickname');
            const courseInput = document.getElementById('user-course');
            const anonToggle = document.getElementById('anon-toggle');
            const anonLabel = document.getElementById('anon-label');
            const identityFields = document.getElementById('identity-fields');
            const status = document.getElementById('status-msg');
            
            view.classList.remove('hidden');

            anonToggle.onchange = () => {
                const isChecked = anonToggle.checked;
                anonLabel.classList.toggle('active', isChecked);
                
                if (isChecked) {
                    identityFields.style.opacity = "0";
                    identityFields.style.transform = "translateY(-10px) scaleY(0.95)";
                    identityFields.style.pointerEvents = "none";
                    // Brief delay to hide after fade
                    setTimeout(() => { if(anonToggle.checked) identityFields.style.display = "none"; }, 400);
                } else {
                    identityFields.style.display = "block";
                    // Force reflow
                    void identityFields.offsetWidth;
                    identityFields.style.opacity = "1";
                    identityFields.style.transform = "translateY(0) scaleY(1)";
                    identityFields.style.pointerEvents = "all";
                }
            };

            btn.onclick = async () => {
                const text = input.value.trim();
                if (!text) return;
                
                btn.disabled = true;
                status.innerText = "Transmitting to the Loop...";
                
                const payload = {
                    text,
                    timestamp: serverTimestamp(),
                    authorId: uid,
                    visible: false,
                    isAnonymous: anonToggle.checked,
                    nickname: anonToggle.checked ? "Anonymous" : nicknameInput.value.trim(),
                    course: anonToggle.checked ? "" : courseInput.value.trim()
                };

                try {
                    await addDoc(collection(db, 'artifacts', APP_COLLECTION_ID, 'public', 'data', 'questions'), payload);
                    input.value = "";
                    status.innerText = "The inquiry has been received.";
                    setTimeout(() => status.innerText = "", 4000);
                } catch (e) {
                    status.innerText = "The Loop is unstable. Try again.";
                } finally {
                    btn.disabled = false;
                }
            };
        }

        function initAdmin() {
            document.body.classList.add('admin-mode');
            const view = document.getElementById('view-admin');
            const list = document.getElementById('admin-list');
            view.classList.remove('hidden');
            const qRef = collection(db, 'artifacts', APP_COLLECTION_ID, 'public', 'data', 'questions');
            let currentDocs = [];

            onSnapshot(qRef, (snapshot) => {
                currentDocs = snapshot.docs;
                const items = snapshot.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .sort((a, b) => (b.timestamp?.toMillis() || 0) - (a.timestamp?.toMillis() || 0));

                if (items.length === 0) {
                    list.innerHTML = `<div class="empty-state">No inquiries have arrived yet...</div>`;
                    return;
                }

                list.innerHTML = "";
                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'admin-card';
                    const authorStr = item.isAnonymous ? "Anonymous" : `${item.nickname || 'Unknown'} (${item.course || 'N/A'})`;
                    card.innerHTML = `
                        <div style="flex:1; padding-right:20px;">
                            <small style="color:var(--accent-red)">FROM: ${escapeHTML(authorStr)}</small>
                            <p style="margin:5px 0 0 0; font-size:1.1rem; color:#fff;">${escapeHTML(item.text)}</p>
                        </div>
                        <div class="admin-controls">
                            <button class="toggle-btn ${item.visible ? 'btn-hide' : 'btn-show'}">
                                ${item.visible ? 'HIDE' : 'SHOW'}
                            </button>
                            <button class="toggle-btn btn-delete">DEL</button>
                        </div>
                    `;
                    card.querySelector('.btn-delete').onclick = () => {
                        if(confirm("Erase from history?")) deleteDoc(doc(db, 'artifacts', APP_COLLECTION_ID, 'public', 'data', 'questions', item.id));
                    };
                    card.querySelector('.btn-show, .btn-hide').onclick = () => {
                        updateDoc(doc(db, 'artifacts', APP_COLLECTION_ID, 'public', 'data', 'questions', item.id), { visible: !item.visible });
                    };
                    list.appendChild(card);
                });
            });
            document.getElementById('bulk-show').onclick = () => currentDocs.forEach(d => updateDoc(d.ref, { visible: true }));
            document.getElementById('bulk-hide').onclick = () => currentDocs.forEach(d => updateDoc(d.ref, { visible: false }));
        }

        function initDisplay() {
            document.body.classList.add('obs-overlay');
            const view = document.getElementById('view-display');
            const container = document.getElementById('qa-container');
            view.classList.remove('hidden');
            const qRef = collection(db, 'artifacts', APP_COLLECTION_ID, 'public', 'data', 'questions');

            onSnapshot(qRef, (snapshot) => {
                const activeData = snapshot.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .filter(d => d.timestamp && d.visible === true)
                    .sort((a, b) => b.timestamp.toMillis() - a.timestamp.toMillis())
                    .slice(0, 4); 

                const activeIds = new Set(activeData.map(d => d.id));
                const existingElements = Array.from(container.querySelectorAll('.question-card'));
                
                existingElements.forEach(el => {
                    if (!activeIds.has(el.dataset.id) && !el.classList.contains('exiting')) {
                        el.classList.add('exiting');
                        el.removeAttribute('data-index');
                        setTimeout(() => el.remove(), 1500);
                    }
                });

                activeData.forEach((data, index) => {
                    let el = document.getElementById(`q-${data.id}`);
                    
                    if (!el) {
                        el = document.createElement('div');
                        el.id = `q-${data.id}`;
                        el.dataset.id = data.id;
                        el.className = 'question-card';
                        
                        const authorInfo = data.isAnonymous ? "An Anonymous Soul" : `From: ${data.nickname} (${data.course})`;
                        
                        el.innerHTML = `
                            <div class="card-label">The Inquiry</div>
                            <span class="author-meta">${escapeHTML(authorInfo)}</span>
                            <p class="question-text">${escapeHTML(data.text)}</p>
                        `;
                        container.appendChild(el);
                        void el.offsetWidth; 
                    }

                    el.setAttribute('data-index', index);
                    el.style.setProperty('--stack-index', index);
                    
                    const label = el.querySelector('.card-label');
                    label.innerText = (index === 0) ? "The Primary Inquiry" : `Peculiar History [${index}]`;
                });
            });
        }
    </script>
</body>
</html>
