<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Home for the Peculiar | Live Q&A</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IM+Fell+English&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --paper-color: #e8e2d2;
            --ink-color: #2c2c2c;
            --accent-red: #8b0000;
            --bg-dark: #121212;
        }

        /* RESET & BASE */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Special Elite', typewriter, serif;
            min-height: 100vh;
            background-color: var(--bg-dark);
            color: var(--ink-color);
            transition: background-color 0.5s ease;
        }

        /* THE CHAMELEON: OBS / PROJECTOR OVERLAY MODE */
        body.obs-overlay {
            background-color: transparent !important;
            overflow: hidden;
            padding: 50px; /* More breathing room for projector edges */
        }

        /* AUDIENCE SUBMISSION UI */
        .submission-container {
            max-width: 500px;
            margin: 40px auto;
            background: var(--paper-color);
            padding: 40px 30px;
            background-image: url('https://www.transparenttextures.com/patterns/parchment.png');
            box-shadow: 15px 15px 40px rgba(0,0,0,0.6);
            clip-path: polygon(1% 2%, 98% 0%, 100% 97%, 3% 100%, 0% 95%);
            transform: rotate(-1deg);
        }

        h1 { font-family: 'IM Fell English', serif; color: var(--accent-red); text-align: center; font-size: 2.2rem; margin: 0 0 10px 0; }
        .sub-header { text-align: center; font-style: italic; opacity: 0.8; margin-bottom: 30px; display: block; }
        
        textarea#question-input {
            width: 100%;
            height: 150px;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(0,0,0,0.2);
            font-family: 'Special Elite', serif;
            font-size: 1.2rem;
            line-height: 1.5;
            outline: none;
            padding: 10px;
            display: block;
        }

        button#submit-btn {
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 20px;
            font-family: 'Special Elite', serif;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 30px;
            box-shadow: 0 5px 0 #5a0000;
            transition: all 0.1s;
        }
        button#submit-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #5a0000; }
        button#submit-btn:disabled { background: #666; cursor: not-allowed; box-shadow: none; }

        /* LIVE OVERLAY - PROJECTOR OPTIMIZED MASONRY */
        #qa-container {
            width: 100%;
            column-count: 2; /* 2 Columns for better readability on large screens */
            column-gap: 40px;
            max-width: 1600px;
            margin: 0 auto;
        }

        @media (max-width: 1000px) { #qa-container { column-count: 1; } }

        .question-card {
            display: inline-block;
            width: 100%;
            margin-bottom: 40px; /* More vertical space */
            background-color: var(--paper-color);
            padding: 40px; /* Larger padding for medium size */
            position: relative;
            background-image: url('https://www.transparenttextures.com/patterns/parchment.png');
            box-shadow: 12px 12px 30px rgba(0,0,0,0.5);
            animation: cardEnter 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            border-left: 10px solid var(--accent-red); /* Thicker border for visibility */
            clip-path: polygon(0% 0%, 100% 1%, 99% 99%, 1% 100%);
            break-inside: avoid;
        }

        .card-label { 
            font-size: 1rem; /* Larger label */
            color: var(--accent-red); 
            text-transform: uppercase; 
            letter-spacing: 4px;
            margin-bottom: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
        }
        .card-label::after {
            content: ""; flex: 1; height: 2px; background: rgba(139, 0, 0, 0.2); margin-left: 15px;
        }

        .question-text { 
            font-size: 2rem; /* Medium-Large size for projector readability */
            color: var(--ink-color); 
            margin: 0; 
            line-height: 1.4;
            font-family: 'Special Elite', serif;
            word-wrap: break-word;
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: scale(0.95) translateY(40px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .hidden { display: none !important; }
        #status-msg { text-align: center; margin-top: 15px; font-size: 0.9rem; min-height: 1.2em; color: var(--accent-red); }
    </style>
</head>
<body>

    <!-- AUDIENCE SUBMISSION VIEW -->
    <div id="submission-view" class="submission-container hidden">
        <h1>A Home for the Peculiar</h1>
        <span class="sub-header">Submit your inquiry to the panel</span>
        <textarea id="question-input" placeholder="Type your inquiry here..."></textarea>
        <button id="submit-btn">SEND INTO THE LOOP</button>
        <div id="status-msg"></div>
    </div>

    <!-- OBS / PROJECTOR OVERLAY VIEW -->
    <div id="qa-container" class="hidden"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBTjoy3Kvc3L5Fl6XIy3lq-L8BFMOY77gM",
            authDomain: "missperi.firebaseapp.com",
            projectId: "missperi",
            storageBucket: "missperi.firebasestorage.app",
            messagingSenderId: "825548876752",
            appId: "1:825548876752:web:e2f64e3d688e147040a7d5",
            measurementId: "G-F3KVKSW3P3"
        };

        const APP_COLLECTION_ID = 'peculiar_app';
        const params = new URLSearchParams(window.location.search);
        const isOverlay = params.get('display') === 'true';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        signInAnonymously(auth).then((userCred) => {
            if (isOverlay) {
                setupOverlay(db);
            } else {
                setupSubmission(db, userCred.user.uid);
            }
        }).catch(err => console.error("Firebase Auth Error:", err));

        function setupSubmission(db, uid) {
            document.getElementById('submission-view').classList.remove('hidden');
            const btn = document.getElementById('submit-btn');
            const input = document.getElementById('question-input');
            const status = document.getElementById('status-msg');

            btn.onclick = async () => {
                const text = input.value.trim();
                if (!text) return;
                btn.disabled = true;
                status.innerText = "Transmitting...";
                try {
                    await addDoc(collection(db, 'artifacts', APP_COLLECTION_ID, 'public', 'data', 'questions'), {
                        text: text,
                        timestamp: serverTimestamp(),
                        author: uid
                    });
                    input.value = "";
                    status.innerText = "Sent successfully into the loop.";
                    setTimeout(() => status.innerText = "", 4000);
                } catch (e) {
                    status.innerText = "Transmission Error.";
                } finally {
                    btn.disabled = false;
                }
            };
        }

        function setupOverlay(db) {
            document.body.classList.add('obs-overlay');
            const container = document.getElementById('qa-container');
            container.classList.remove('hidden');

            const q = collection(db, 'artifacts', APP_COLLECTION_ID, 'public', 'data', 'questions');
            onSnapshot(q, (snapshot) => {
                const items = snapshot.docs
                    .map(doc => doc.data())
                    .filter(d => d.timestamp)
                    .sort((a, b) => b.timestamp.toMillis() - a.timestamp.toMillis())
                    .slice(0, 10); // 10 is enough for a clean 2-column projector view

                container.innerHTML = "";
                items.forEach(data => {
                    const card = document.createElement('div');
                    card.className = 'question-card';
                    card.innerHTML = `<div class="card-label">Incoming Inquiry</div><p class="question-text">${escape(data.text)}</p>`;
                    container.appendChild(card);
                });
            });
        }

        function escape(html) {
            const text = document.createTextNode(html);
            const p = document.createElement('p');
            p.appendChild(text);
            return p.innerHTML;
        }
    </script>
</body>
</html>
