<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Home for the Peculiar | Live Q&A</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IM+Fell+English&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --paper-color: #e8e2d2;
            --ink-color: #2c2c2c;
            --accent-red: #8b0000;
            --bg-dark: #121212;
            --admin-bg: #0f1115;
            --transition-speed: 0.8s;
            --ease: cubic-bezier(0.34, 1.56, 0.64, 1); /* Bouncy entry ease */
        }

        /* RESET & BASE */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Special Elite', typewriter, serif;
            min-height: 100vh;
            background-color: var(--bg-dark);
            color: var(--ink-color);
            overflow-x: hidden;
        }

        /* THE CHAMELEON: OBS / PROJECTOR OVERLAY MODE */
        body.obs-overlay {
            background-color: transparent !important;
            overflow: hidden;
            padding: 50px; 
        }

        /* ATMOSPHERIC AUDIENCE BACKGROUND */
        body:not(.admin-mode):not(.obs-overlay) {
            background: 
                linear-gradient(rgba(18, 18, 18, 0.85), rgba(18, 18, 18, 0.95)),
                url('https://www.transparenttextures.com/patterns/dark-matter.png'),
                url('https://images.unsplash.com/photo-1501139083538-0139583c060f?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* ADMIN MODE STYLING */
        body.admin-mode {
            background-color: var(--admin-bg);
            color: #e0e0e0;
            background-image: radial-gradient(circle at center, #1a1c22 0%, #0f1115 100%);
        }

        /* AUDIENCE SUBMISSION UI */
        .submission-container {
            max-width: 550px;
            margin: 60px auto;
            background: var(--paper-color);
            padding: 50px 40px;
            background-image: url('https://www.transparenttextures.com/patterns/parchment.png');
            box-shadow: 0 0 50px rgba(0,0,0,0.5), 20px 20px 60px rgba(0,0,0,0.9);
            clip-path: polygon(1% 1%, 99% 0%, 100% 98%, 2% 100%, 0% 95%);
            transform: rotate(-0.5deg);
            position: relative;
        }
        .submission-container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 1px solid rgba(0,0,0,0.1);
            pointer-events: none;
        }

        h1 { font-family: 'IM Fell English', serif; color: var(--accent-red); text-align: center; font-size: 2.5rem; margin: 0 0 10px 0; }
        .sub-header { text-align: center; font-style: italic; opacity: 0.8; margin-bottom: 30px; display: block; letter-spacing: 1px; }
        
        textarea#question-input {
            width: 100%;
            height: 180px;
            background: transparent;
            border: none;
            border-bottom: 1px dashed rgba(0,0,0,0.3);
            font-family: 'Special Elite', serif;
            font-size: 1.25rem;
            line-height: 1.6;
            outline: none;
            padding: 10px;
            display: block;
            resize: none;
            color: var(--ink-color);
        }

        button.action-btn {
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 22px;
            font-family: 'Special Elite', serif;
            font-size: 1.2rem;
            cursor: pointer;
            width: 100%;
            margin-top: 40px;
            box-shadow: 0 6px 0 #4a0000;
            transition: all 0.2s;
            letter-spacing: 2px;
        }
        button.action-btn:hover { background: #a00000; transform: translateY(-2px); }
        button.action-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #4a0000; }
        button.action-btn:disabled { background: #666 !important; cursor: not-allowed; box-shadow: none; transform: none; }

        /* LIVE OVERLAY - PROJECTOR */
        #qa-container {
            position: relative;
            max-width: 900px;
            margin: 0 auto;
            height: 100vh;
            perspective: 2000px;
        }

        .question-card {
            position: absolute;
            width: 100%;
            background-color: var(--paper-color);
            padding: 35px 45px; 
            background-image: url('https://www.transparenttextures.com/patterns/parchment.png');
            box-shadow: 10px 10px 30px rgba(0,0,0,0.3);
            border-left: 15px solid var(--accent-red); 
            clip-path: polygon(0.5% 0%, 100% 0.5%, 99.5% 99.5%, 0% 100%);
            
            /* Enhanced Animation Engine */
            transition: 
                transform var(--transition-speed) var(--ease),
                opacity var(--transition-speed) ease,
                filter 0.5s ease;
            
            pointer-events: none;
            will-change: transform, opacity;
            transform-origin: center center;
            
            /* Hidden Entrance State */
            opacity: 0;
            transform: translateY(calc(var(--y-offset, 0px) + 200px)) rotateX(-30deg) scale(0.8);
            filter: blur(5px);
        }

        /* Shown state */
        .question-card.active {
            opacity: 1;
            transform: translateY(var(--y-offset)) rotateX(0deg) scale(1);
            filter: blur(0);
        }

        /* Hidden/Exit state */
        .question-card.exiting {
            opacity: 0;
            transform: translateY(calc(var(--y-offset) - 150px)) rotateX(30deg) scale(0.8);
            filter: blur(10px);
        }

        .card-label { 
            font-size: 0.85rem; 
            color: var(--accent-red); 
            text-transform: uppercase; 
            letter-spacing: 6px;
            margin-bottom: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            opacity: 0.6;
        }
        .card-label::after { content: ""; flex: 1; height: 1px; background: rgba(139, 0, 0, 0.2); margin-left: 20px; }

        .question-text { 
            font-size: 1.9rem; 
            color: var(--ink-color); 
            margin: 0; 
            line-height: 1.4;
            font-family: 'Special Elite', serif;
            word-wrap: break-word;
        }

        /* ADMIN INTERFACE */
        .admin-card {
            background: #1e2128;
            color: #fff;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .admin-controls { display: flex; gap: 12px; }
        .toggle-btn {
            padding: 12px 20px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-family: 'Special Elite', serif;
            font-weight: bold;
            transition: transform 0.1s, opacity 0.2s;
        }
        .toggle-btn:hover { opacity: 0.9; transform: scale(1.05); }
        .toggle-btn:active { transform: scale(0.95); }
        .btn-show { background: #2ecc71; color: white; }
        .btn-hide { background: #e67e22; color: white; }
        .btn-delete { background: #e74c3c; color: white; }

        .hidden { display: none !important; }
        #status-msg { text-align: center; margin-top: 15px; font-size: 0.9rem; min-height: 1.2em; color: var(--accent-red); font-weight: bold; }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 40px 0;
            padding-bottom: 20px;
            border-bottom: 2px solid #333;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            opacity: 0.5;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- VIEW 1: SUBMISSION -->
    <div id="view-submission" class="submission-container hidden">
        <h1>A Home for the Peculiar</h1>
        <span class="sub-header">Submit your inquiry to the loop</span>
        <textarea id="question-input" placeholder="Type your inquiry here..."></textarea>
        <button id="submit-btn" class="action-btn">SEND INTO THE LOOP</button>
        <div id="status-msg"></div>
    </div>

    <!-- VIEW 2: ADMIN PANEL -->
    <div id="view-admin" class="hidden" style="max-width: 900px; margin: 0 auto; padding: 20px;">
        <div class="admin-header">
            <div>
                <h1 style="text-align: left; color: #fff; margin:0;">Moderation Chamber</h1>
                <p style="margin:5px 0 0 0; opacity: 0.6;">Manage the Peculiar Queue</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="bulk-show" class="toggle-btn btn-show">SHOW ALL</button>
                <button id="bulk-hide" class="toggle-btn btn-hide">HIDE ALL</button>
            </div>
        </div>
        <div id="admin-list"></div>
    </div>

    <!-- VIEW 3: PROJECTOR/DISPLAY -->
    <div id="view-display" class="hidden">
        <div id="qa-container"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CONFIG & STATE
        const firebaseConfig = {
            apiKey: "AIzaSyBTjoy3Kvc3L5Fl6XIy3lq-L8BFMOY77gM",
            authDomain: "missperi.firebaseapp.com",
            projectId: "missperi",
            storageBucket: "missperi.firebasestorage.app",
            messagingSenderId: "825548876752",
            appId: "1:825548876752:web:e2f64e3d688e147040a7d5",
            measurementId: "G-F3KVKSW3P3"
        };

        const APP_COLLECTION_ID = 'peculiar_app';
        const params = new URLSearchParams(window.location.search);
        const IS_ADMIN = params.get('admin') === 'true';
        const IS_DISPLAY = params.get('display') === 'true';

        // UTILS
        const escapeHTML = (str) => {
            const p = document.createElement('p');
            p.textContent = str;
            return p.innerHTML;
        };

        // FIREBASE INIT
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // MAIN APP ROUTING
        signInAnonymously(auth).then((userCred) => {
            if (IS_ADMIN) initAdmin();
            else if (IS_DISPLAY) initDisplay();
            else initSubmission(userCred.user.uid);
        });

        function initSubmission(uid) {
            const view = document.getElementById('view-submission');
            const btn = document.getElementById('submit-btn');
            const input = document.getElementById('question-input');
            const status = document.getElementById('status-msg');

            view.classList.remove('hidden');

            btn.onclick = async () => {
                const text = input.value.trim();
                if (!text) return;

                btn.disabled = true;
                status.innerText = "Transmitting to the Loop...";
                
                try {
                    await addDoc(collection(db, 'artifacts', APP_COLLECTION_ID, 'public', 'data', 'questions'), {
                        text,
                        timestamp: serverTimestamp(),
                        author: uid,
                        visible: false
                    });
                    input.value = "";
                    status.innerText = "The inquiry has been received.";
                    setTimeout(() => status.innerText = "", 4000);
                } catch (e) {
                    status.innerText = "The Loop is unstable. Try again.";
                } finally {
                    btn.disabled = false;
                }
            };
        }

        function initAdmin() {
            document.body.classList.add('admin-mode');
            const view = document.getElementById('view-admin');
            const list = document.getElementById('admin-list');
            view.classList.remove('hidden');

            const qRef = collection(db, 'artifacts', APP_COLLECTION_ID, 'public', 'data', 'questions');
            let currentDocs = [];

            onSnapshot(qRef, (snapshot) => {
                currentDocs = snapshot.docs;
                const items = snapshot.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .sort((a, b) => (b.timestamp?.toMillis() || 0) - (a.timestamp?.toMillis() || 0));

                if (items.length === 0) {
                    list.innerHTML = `<div class="empty-state">No inquiries have arrived yet...</div>`;
                    return;
                }

                list.innerHTML = "";
                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'admin-card';
                    card.innerHTML = `
                        <div style="flex:1; padding-right:20px;">
                            <p style="margin:0; font-size:1.1rem; color:#fff;">${escapeHTML(item.text)}</p>
                        </div>
                        <div class="admin-controls">
                            <button class="toggle-btn ${item.visible ? 'btn-hide' : 'btn-show'}">
                                ${item.visible ? 'HIDE' : 'SHOW'}
                            </button>
                            <button class="toggle-btn btn-delete">DEL</button>
                        </div>
                    `;

                    card.querySelector('.btn-delete').onclick = () => {
                        if(confirm("Erase from history?")) deleteDoc(doc(db, 'artifacts', APP_COLLECTION_ID, 'public', 'data', 'questions', item.id));
                    };
                    card.querySelector('.btn-show, .btn-hide').onclick = () => {
                        updateDoc(doc(db, 'artifacts', APP_COLLECTION_ID, 'public', 'data', 'questions', item.id), { visible: !item.visible });
                    };

                    list.appendChild(card);
                });
            });

            document.getElementById('bulk-show').onclick = () => currentDocs.forEach(d => updateDoc(d.ref, { visible: true }));
            document.getElementById('bulk-hide').onclick = () => currentDocs.forEach(d => updateDoc(d.ref, { visible: false }));
        }

        function initDisplay() {
            document.body.classList.add('obs-overlay');
            const view = document.getElementById('view-display');
            const container = document.getElementById('qa-container');
            view.classList.remove('hidden');

            const qRef = collection(db, 'artifacts', APP_COLLECTION_ID, 'public', 'data', 'questions');
            const CARD_GAP = 25;

            onSnapshot(qRef, (snapshot) => {
                const activeData = snapshot.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .filter(d => d.timestamp && d.visible === true)
                    .sort((a, b) => b.timestamp.toMillis() - a.timestamp.toMillis())
                    .slice(0, 6); // Limit to 6 for clean stacking

                const activeIds = new Set(activeData.map(d => d.id));
                const existingElements = Array.from(container.querySelectorAll('.question-card'));
                
                // 1. Cleanup old cards
                existingElements.forEach(el => {
                    const id = el.dataset.id;
                    if (!activeIds.has(id) && !el.classList.contains('exiting')) {
                        el.classList.add('exiting');
                        el.classList.remove('active');
                        setTimeout(() => el.remove(), 1000);
                    }
                });

                // 2. Position calculation and creation
                let currentY = 0;
                activeData.forEach((data, index) => {
                    let el = document.getElementById(`q-${data.id}`);
                    
                    if (!el) {
                        el = document.createElement('div');
                        el.id = `q-${data.id}`;
                        el.dataset.id = data.id;
                        el.className = 'question-card';
                        el.innerHTML = `
                            <div class="card-label">Incoming Inquiry</div>
                            <p class="question-text">${escapeHTML(data.text)}</p>
                        `;
                        
                        // Set the y-offset early so the initial transition starts from a valid spot
                        // We use a temporary high Y to slide in from bottom
                        el.style.setProperty('--y-offset', `${currentY + 200}px`);
                        container.appendChild(el);
                        
                        // Trigger entry transition
                        requestAnimationFrame(() => {
                            requestAnimationFrame(() => {
                                el.classList.add('active');
                            });
                        });
                    }

                    // For existing or newly active cards, update position to "pile up"
                    // We wrap this in an observer to handle height changes if text wraps
                    const updatePos = () => {
                        if (el && !el.classList.contains('exiting')) {
                            el.style.setProperty('--y-offset', `${currentY}px`);
                            currentY += el.offsetHeight + CARD_GAP;
                        }
                    };

                    // Immediate position update
                    updatePos();

                    // Short timeout to catch browser layout for height-dependent piling
                    setTimeout(updatePos, 50);
                    setTimeout(updatePos, 300); // Re-check after partial animation
                });
            });
        }
    </script>
</body>
</html>
